version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-esrog_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_db_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-esrog_shuk_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    restart: always
    depends_on:
      - db
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      DATABASE_URL: postgres://${POSTGRES_USER:-esrog_user}:${POSTGRES_PASSWORD:-secure_db_password_123}@db:5432/${POSTGRES_DB:-esrog_shuk_production}

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from esrog-backend.duckdns.org --to web:3000
    depends_on:
      - web

volumes:
  postgres_data:
